<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e10" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OrderMe" />
    <!-- A solid black bar reads in both themes; translucent would put white status text over the light theme. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="Collect your friends' drink and snack requests and read the Round out at the counter." />
    <title>This round is for me</title>
    <script>
      // Apply a saved light theme before first paint, so it doesn't flash dark while the app loads.
      try {
        var theme = JSON.parse(localStorage.getItem('order-me') || '{}').settings?.theme
        if (theme === 'system') theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        if (theme === 'light') document.documentElement.dataset.theme = 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
