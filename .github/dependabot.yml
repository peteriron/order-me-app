# Monthly update proposals for the npm packages and the pinned GitHub Actions, grouped into one PR each.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # Minor and patch updates arrive together; majors arrive on their own, so one can be reviewed and reverted alone.
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # @types/node follows the Node major that CI and the build run on (node-version in ci.yml), not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
