<title>OrderMe Prototype</title>
<meta name="theme-color" content="#0E0E10">
<!--
  Throwaway clickable prototype for order-me-app v1.
  Implements the decisions in docs/prd.md and docs/look-and-feel.md with mock data.
  Not production code: no tests, minimal error handling. Rebuild properly in the real app.
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #0E0E10;
    --surface: #1A1A1F;
    --surface-2: #26262D;
    --border: #2E2E36;
    --text: #F5F5F4;
    --muted: #A1A1AA;
    --accent: #F5A524;
    --accent-fill: #F5A524;
    --on-accent: #1A1204;
    --accent-soft: rgb(245 165 36 / .14);
    --accent-line: rgb(245 165 36 / .45);
    --snack: #2DD4BF;
    --danger: #F87171;
    --scrim: rgb(0 0 0 / .6);
    --tile-shadow: none;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --font: -apple-system, "SF Pro Text", Roboto, "Segoe UI", system-ui, sans-serif;
  }
  :root[data-mode="light"] {
    color-scheme: light;
    --bg: #FAFAF9;
    --surface: #FFFFFF;
    --surface-2: #F0EFEC;
    --border: #E2E0DB;
    --text: #1C1917;
    --muted: #57534E;
    --accent: #B45309;
    --accent-fill: #F59E0B;
    --on-accent: #1A1204;
    --accent-soft: rgb(245 158 11 / .14);
    --accent-line: rgb(180 83 9 / .45);
    --snack: #0F766E;
    --danger: #B91C1C;
    --scrim: rgb(28 25 23 / .4);
    --tile-shadow: 0 1px 2px rgb(0 0 0 / .06);
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 1rem;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    position: relative;
    height: 100%;
    max-width: 440px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }
  @media (min-width: 480px) {
    .app { border-inline: 1px solid var(--border); }
  }

  /* ---------- pages ---------- */
  .viewport { position: relative; flex: 1; overflow: hidden; touch-action: pan-y; }
  .track {
    display: flex;
    width: 300%;
    height: 100%;
    transition: transform 250ms var(--ease);
    will-change: transform;
  }
  .track.dragging { transition: none; }
  .page {
    flex: 0 0 33.3333%;
    min-width: 0;
    height: 100%;
    overflow-y: auto;
    padding: 20px 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .page-title { font-size: 1.375rem; font-weight: 700; margin: 0; text-wrap: balance; }
  .page-sub { color: var(--muted); font-size: .8125rem; }

  .section { display: flex; flex-direction: column; gap: 10px; }
  .label {
    font-size: .8125rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .label .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .label .dot.snack { background: var(--snack); }

  /* ---------- tiles ---------- */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tile {
    position: relative;
    min-height: 100px;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--tile-shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 6px 10px;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    transition: transform 160ms var(--ease), background 160ms;
  }
  .tile:active { transform: scale(.94); transition-duration: 80ms; background: var(--surface-2); }
  .tile.has { background: var(--accent-soft); border-color: var(--accent-line); }
  .tile .emoji { font-size: 2rem; line-height: 1; }
  .tile .name {
    font-size: .9375rem;
    font-weight: 600;
    line-height: 1.2;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .badge {
    position: absolute;
    top: 6px;
    right: 6px;
    min-width: 28px;
    height: 28px;
    padding: 0 7px;
    border-radius: 14px;
    background: var(--accent-fill);
    color: var(--on-accent);
    font-weight: 800;
    font-size: 1.0625rem;
    font-variant-numeric: tabular-nums;
    display: grid;
    place-items: center;
  }
  .tile.bump .badge { animation: pop 200ms var(--ease); }
  @keyframes pop { 0% { transform: scale(.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  .minus {
    position: absolute;
    top: 0;
    left: 0;
    width: 44px;
    height: 44px;
    border: 0;
    background: none;
    display: grid;
    place-items: center;
    padding: 0;
  }
  .minus span {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    font-size: 1.125rem;
    font-weight: 700;
    line-height: 1;
  }
  .tile.new { border: 1.5px dashed var(--border); background: transparent; box-shadow: none; color: var(--muted); }
  .tile.new .emoji { font-size: 1.75rem; font-weight: 300; }

  /* ---------- bottom bar + hint ---------- */
  .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 8px 12px 8px 8px;
    background: var(--surface-2);
    border-top: 1px solid var(--border);
  }
  .bar .count { flex: 1; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar .empty { flex: 1; text-align: center; color: var(--muted); }
  .btn {
    min-height: 44px;
    padding: 0 16px;
    border-radius: 14px;
    border: 1px solid transparent;
    background: none;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn.primary { background: var(--accent-fill); color: var(--on-accent); }
  .btn.outline { border-color: var(--accent-line); color: var(--accent); }
  .btn.quiet { color: var(--muted); }
  .btn.danger { color: var(--danger); }
  .btn.block { width: 100%; }
  .btn.big { min-height: 56px; font-size: 1.0625rem; }

  .hint {
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 2px 8px calc(4px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
  }
  .hint button {
    min-height: 44px;
    border: 0;
    background: none;
    padding: 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: .6875rem;
    color: var(--muted);
  }
  .hint i { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
  .hint button[aria-current="true"] { color: var(--text); }
  .hint button[aria-current="true"] i { background: var(--accent); }

  /* ---------- counter view ---------- */
  .counter {
    position: absolute;
    inset: 0;
    z-index: 20;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    gap: 12px;
    animation: slideup 280ms var(--ease);
  }
  @keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
  .counter-top { display: flex; align-items: center; gap: 4px; }
  .counter-top .spacer { flex: 1; }
  .icon-btn {
    width: 44px;
    height: 44px;
    border: 0;
    background: none;
    border-radius: 12px;
    display: grid;
    place-items: center;
  }
  .icon-btn svg, .btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .lines { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .line {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .line .n {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    min-width: 2.2ch;
    text-align: right;
  }
  .line .x { color: var(--muted); font-size: 1.25rem; }
  .line .what { flex: 1; font-size: 2rem; font-weight: 700; line-height: 1.15; overflow-wrap: anywhere; }
  .line .ctl { display: flex; gap: 6px; }
  .line .ctl button {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    font-size: 1.25rem;
    color: var(--muted);
  }
  .divider { margin: 18px 0 4px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0 4px; }
  .total span:first-child { font-size: 1.25rem; font-weight: 600; color: var(--muted); }
  .total span:last-child { font-size: 2.5rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

  /* ---------- history ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: var(--tile-shadow);
  }
  .card-head { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  .card-head b { font-size: 1.0625rem; }
  .card-head span { color: var(--muted); }
  .card-summary { border: 0; background: none; padding: 0; text-align: left; line-height: 1.45; }
  .card-lines { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .card-lines li { display: flex; gap: 8px; }
  .card-lines li b { min-width: 2ch; text-align: right; color: var(--accent); font-variant-numeric: tabular-nums; }
  .card-actions { display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
  .empty-state { color: var(--muted); text-align: center; padding: 48px 16px; line-height: 1.5; }

  /* ---------- items + settings ---------- */
  .rows { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 56px;
    padding: 0 8px 0 14px;
    border: 0;
    border-bottom: 1px solid var(--border);
    background: none;
    text-align: left;
    width: 100%;
  }
  .row:last-child { border-bottom: 0; }
  .row .emoji { font-size: 1.5rem; width: 1.75rem; text-align: center; }
  .row .nm { flex: 1; font-weight: 500; }
  .row svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; margin-right: 8px; }
  .setting { display: flex; flex-direction: column; gap: 8px; }
  .setting > span { font-weight: 600; }
  .seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button {
    flex: 1;
    min-height: 40px;
    border: 0;
    border-radius: 10px;
    background: none;
    font-size: .875rem;
    font-weight: 600;
    color: var(--muted);
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgb(0 0 0 / .25); }
  .proto-note { color: var(--muted); font-size: .8125rem; line-height: 1.5; border-top: 1px dashed var(--border); padding-top: 16px; }
  .proto-note button { color: var(--accent); background: none; border: 0; padding: 0; text-decoration: underline; font-size: inherit; }

  /* ---------- sheet, dialog, toast ---------- */
  .scrim { position: absolute; inset: 0; z-index: 30; background: var(--scrim); display: flex; align-items: flex-end; }
  .scrim.center { align-items: center; justify-content: center; padding: 16px; }
  .sheet {
    width: 100%;
    max-height: 92%;
    overflow-y: auto;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 16px;
    animation: slideup 240ms var(--ease);
  }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--border); align-self: center; }
  .sheet h2 { margin: 0; font-size: 1.25rem; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .field > span { font-size: .8125rem; font-weight: 600; color: var(--muted); }
  .input {
    min-height: 48px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    padding: 0 14px;
    font-size: 1rem;
  }
  .emojis { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .emojis button {
    aspect-ratio: 1;
    max-width: 100%;
    min-height: 40px;
    border-radius: 10px;
    border: 1.5px solid transparent;
    background: var(--surface-2);
    font-size: 1.375rem;
    padding: 0;
  }
  .emojis button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .sheet-actions { display: flex; gap: 8px; }
  .sheet-actions .primary { flex: 1; }
  .error { color: var(--danger); font-size: .875rem; }

  .dialog {
    width: 100%;
    max-width: 340px;
    background: var(--surface);
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .dialog p { margin: 0; line-height: 1.45; font-size: 1.0625rem; }
  .dialog .acts { display: flex; justify-content: flex-end; gap: 8px; }
  .dialog .danger-fill { background: var(--danger); color: #fff; }

  .toast {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: calc(118px + env(safe-area-inset-bottom, 0px));
    z-index: 40;
    min-height: 48px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 6px 0 16px;
    box-shadow: 0 8px 24px rgb(0 0 0 / .3);
    animation: rise 180ms var(--ease);
  }
  .toast span { flex: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .track { transition: transform 120ms linear; }
    .tile, .tile:active { transform: none; transition: background 120ms; }
    .tile.bump .badge { animation: none; }
    .counter, .sheet { animation: fade 120ms linear; }
    .toast { animation: fade 120ms linear; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  }
</style>

<div class="app" id="app">
  <div class="viewport" id="viewport">
    <div class="track" id="track">
      <section class="page" id="page-history" aria-label="History"></section>
      <section class="page" id="page-round" aria-label="Round"></section>
      <section class="page" id="page-items" aria-label="Items"></section>
    </div>
  </div>
  <div class="bar" id="bar"></div>
  <nav class="hint" id="hint" aria-label="Pages"></nav>
  <div id="overlay"></div>
  <div id="toast-slot"></div>
</div>

<script>
(() => {
  // ---------------- i18n ----------------
  const T = {
    en: {
      appName: 'This round is for me', history: 'History', round: 'Round', items: 'Items',
      drinks: 'Drinks', snacks: 'Snacks', emptyHint: 'Tap a drink to start', show: 'Show', clear: 'Clear',
      itemsN: n => `${n} ${n === 1 ? 'item' : 'items'}`, markOrdered: 'Mark as ordered', placed: 'Round placed',
      undo: 'Undo', share: 'Share', total: 'Total', orderAgain: 'Order again', new: 'New',
      deleteItemQ: n => `Delete “${n}”? History keeps it.`, clearHistQ: 'Delete all past Rounds?',
      deleteRoundQ: 'Delete this Round from history?',
      skipped: n => `${n} ${n === 1 ? 'item no longer exists and was' : 'items no longer exist and were'} skipped`,
      copied: 'Copied to clipboard', copyFailed: 'Couldn’t copy — sharing isn’t available here',
      today: 'Today', yesterday: 'Yesterday', addItem: 'Add Item', editItem: 'Edit Item', newItem: 'New Item',
      name: 'Name', namePh: 'e.g. Kriek', category: 'Category', drink: 'Drink', snack: 'Snack', emoji: 'Emoji',
      typeEmoji: 'or type your own', save: 'Save', add: 'Add', addToRound: 'Add to Round', cancel: 'Cancel',
      del: 'Delete', settings: 'Settings', language: 'Language', theme: 'Theme', system: 'System',
      dark: 'Dark', light: 'Light', clearHistory: 'Clear history', noHistory: 'No Rounds yet.\nMark a Round as ordered and it shows up here.',
      back: 'Back to Round', inRound: (n, c) => c ? `${n}, ${c} in round` : n, removeOne: n => `Remove one ${n}`,
      addOne: n => `Add one ${n}`, nameRequired: 'Give the Item a name',
      protoNote: 'Prototype — mock data, stored only in this browser. Swipe (or use ← →) between pages.',
      resetDemo: 'Reset demo data', rounds: n => `${n} ${n === 1 ? 'Round' : 'Rounds'}`, catalogN: n => `${n} in your catalog`,
    },
    nl: {
      appName: 'Deze ronde is voor mij', history: 'Geschiedenis', round: 'Ronde', items: 'Items',
      drinks: 'Dranken', snacks: 'Snacks', emptyHint: 'Tik op een drankje om te starten', show: 'Toon', clear: 'Wissen',
      itemsN: n => `${n} ${n === 1 ? 'item' : 'items'}`, markOrdered: 'Besteld', placed: 'Ronde geplaatst',
      undo: 'Ongedaan maken', share: 'Delen', total: 'Totaal', orderAgain: 'Opnieuw bestellen', new: 'Nieuw',
      deleteItemQ: n => `“${n}” verwijderen? De geschiedenis blijft behouden.`, clearHistQ: 'Alle vorige rondes verwijderen?',
      deleteRoundQ: 'Deze ronde uit de geschiedenis verwijderen?',
      skipped: n => `${n} ${n === 1 ? 'item bestaat' : 'items bestaan'} niet meer en ${n === 1 ? 'is' : 'zijn'} overgeslagen`,
      copied: 'Gekopieerd', copyFailed: 'Kopiëren lukt niet — delen is hier niet beschikbaar',
      today: 'Vandaag', yesterday: 'Gisteren', addItem: 'Item toevoegen', editItem: 'Item bewerken', newItem: 'Nieuw item',
      name: 'Naam', namePh: 'bv. Kriek', category: 'Categorie', drink: 'Drank', snack: 'Snack', emoji: 'Emoji',
      typeEmoji: 'of typ er zelf een', save: 'Bewaren', add: 'Toevoegen', addToRound: 'Aan ronde toevoegen', cancel: 'Annuleren',
      del: 'Verwijderen', settings: 'Instellingen', language: 'Taal', theme: 'Thema', system: 'Systeem',
      dark: 'Donker', light: 'Licht', clearHistory: 'Geschiedenis wissen', noHistory: 'Nog geen rondes.\nMarkeer een ronde als besteld en ze verschijnt hier.',
      back: 'Terug naar ronde', inRound: (n, c) => c ? `${n}, ${c} in ronde` : n, removeOne: n => `Eén ${n} minder`,
      addOne: n => `Eén ${n} meer`, nameRequired: 'Geef het item een naam',
      protoNote: 'Prototype — voorbeelddata, enkel bewaard in deze browser. Swipe (of gebruik ← →) tussen pagina’s.',
      resetDemo: 'Demodata herstellen', rounds: n => `${n} ${n === 1 ? 'ronde' : 'rondes'}`, catalogN: n => `${n} in je catalogus`,
    },
  };

  const SEED = [
    ['🍺', 'drink', 'Beer', 'Bier'], ['🍺', 'drink', 'Duvel', 'Duvel'], ['🍺', 'drink', '0.0 Beer', '0.0 Bier'],
    ['🥤', 'drink', 'Cola', 'Cola'], ['💧', 'drink', 'Still water', 'Plat water'], ['🫧', 'drink', 'Sparkling water', 'Bruiswater'],
    ['☕', 'drink', 'Coffee', 'Koffie'], ['☕', 'drink', 'Decaf', 'Deca'], ['🍵', 'drink', 'Tea', 'Thee'],
    ['🍊', 'drink', 'Fanta', 'Fanta'], ['🧋', 'drink', 'Ice Tea', 'Ice Tea'], ['🧃', 'drink', 'Juice', 'Fruitsap'],
    ['🥂', 'drink', 'Cava', 'Cava'], ['🥂', 'drink', 'White wine', 'Witte wijn'], ['🍷', 'drink', 'Rosé', 'Rosé'],
    ['🍷', 'drink', 'Red wine', 'Rode wijn'], ['🥃', 'drink', 'Liquor', 'Sterke drank'],
    ['🥔', 'snack', 'Chips', 'Chips'], ['🥜', 'snack', 'Nuts', 'Nootjes'], ['🧀', 'snack', 'Cheese', 'Kaasblokjes'],
    ['🧆', 'snack', 'Bitterballen', 'Bitterballen'],
  ];
  const EMOJIS = ['🍺','🍻','🍷','🥂','🍾','🥃','🍸','🍹','🧉','🍶','☕','🍵','🧋','🥤','🧃','💧','🫧','🥛','🍋','🍊','🍎','🍓','🥥','🧊',
                  '🔥','🥔','🥜','🧀','🧆','🍟','🌭','🍕','🥨','🫒','🥓','🍗','🌮','🍪','🍫','🍦'];
  const STORE = 'orderme-proto-v1';
  const DAY = 864e5;

  // ---------------- state ----------------
  let S;
  const uid = () => Math.random().toString(36).slice(2, 10);
  const detectLang = () => (navigator.language || 'en').toLowerCase().startsWith('nl') ? 'nl' : 'en';
  const lang = () => S.lang === 'system' ? detectLang() : S.lang;
  const t = () => T[lang()];

  function seedState() {
    const L = detectLang();

    }
  });
  document.addEventListener('submit', e => {
    if (e.target.id !== 'sheet-form') return;
    e.preventDefault();
    const o = overlay, name = $('f-name').value.trim();
    if (!name) { o.draft.name = ''; o.error = t().nameRequired; renderOverlay(); $('f-name').focus(); return; }
    const data = { name, category: o.draft.category, emoji: o.draft.emoji || '🍺' };
    if (o.mode === 'edit') Object.assign(item(o.id), data);
    else {
      const it = { id: uid(), ...data };
      S.catalog.push(it);
      if (o.mode === 'round') S.round[it.id] = 1;
    }
    save(); syncOrder(); closeOverlay(); renderRound(); renderItems(); renderBar();
  });

  matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => { if (S.theme === 'system') applyTheme(); });

  // ---------------- boot ----------------
  S = load();
  computeOrder();
  render();
})();
</script>
